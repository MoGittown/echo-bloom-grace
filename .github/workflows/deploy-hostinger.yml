# Build + Deploy nach Hostinger (kuechenready.de)
# Secrets: docs/DEPLOY_GITHUB.md

name: Deploy Web to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Production-Build prüfen
        run: |
          grep -q '/assets/' dist/index.html
          ! grep -q '/src/main' dist/index.html

      - name: Build erfolgreich (Summary)
        run: |
          echo "## ✅ Web-Build erfolgreich" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Zeit | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dateien in \`dist/\`:" >> $GITHUB_STEP_SUMMARY
          ls -la dist/ | head -20 >> $GITHUB_STEP_SUMMARY

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy to Hostinger (FTP)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: SPA .htaccess sicherstellen
        run: test -f dist/.htaccess || cp public/.htaccess dist/.htaccess

      - name: Dist-Artefakt prüfen
        run: |
          grep -q '/assets/' dist/index.html
          ! grep -q '/src/main' dist/index.html

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 300000
          local-dir: ./dist/
          # FTP-Root ist oft public_html → Addon-Domain ein Verzeichnis höher
          server-dir: ../domains/kuechenready.de/public_html/
          dangerous-clean-slate: true

      - name: Live-Seite prüfen
        run: |
          sleep 5
          HTML="$(curl -fsSL https://kuechenready.de/)"
          echo "$HTML" | grep -q '/assets/'
          ! echo "$HTML" | grep -q '/src/main'

      - name: Deploy erfolgreich (Summary)
        run: |
          echo "## 🚀 Deploy auf Hostinger erfolgreich" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Live-URLs prüfen:**" >> $GITHUB_STEP_SUMMARY
          echo "- Admin: https://kuechenready.de/admin" >> $GITHUB_STEP_SUMMARY
          echo "- Landing: https://kuechenready.de/{studio-slug}" >> $GITHUB_STEP_SUMMARY
          echo "- Check: https://kuechenready.de/{studio-slug}/check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
