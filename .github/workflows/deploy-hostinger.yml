# Build + Deploy nach Hostinger (kuechenready.de)
# Secrets: docs/DEPLOY_GITHUB.md

name: Deploy Web to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PUBLIC_WEB_URL: ${{ secrets.VITE_PUBLIC_WEB_URL }}
          VITE_APP_DEEP_LINK_SCHEME: kuechencheck
          VITE_PLAY_STORE_URL: ${{ secrets.VITE_PLAY_STORE_URL }}

      - name: Build erfolgreich (Summary)
        run: |
          echo "## ✅ Web-Build erfolgreich" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Zeit | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dateien in \`dist/\`:" >> $GITHUB_STEP_SUMMARY
          ls -la dist/ | head -20 >> $GITHUB_STEP_SUMMARY

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Hostinger (FTP)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: ./dist/
          # FTP-Root ist oft public_html → Addon-Domain ein Verzeichnis höher
          server-dir: ../domains/kuechenready.de/public_html/
          dangerous-clean-slate: true
          include: |
            **/*
            **/.htaccess

      - name: Deploy erfolgreich (Summary)
        run: |
          echo "## 🚀 Deploy auf Hostinger erfolgreich" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Live-URLs prüfen:**" >> $GITHUB_STEP_SUMMARY
          echo "- Admin: https://kuechenready.de/admin" >> $GITHUB_STEP_SUMMARY
          echo "- Landing: https://kuechenready.de/s/{studio-slug}" >> $GITHUB_STEP_SUMMARY
          echo "- Check: https://kuechenready.de/s/{studio-slug}/check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
