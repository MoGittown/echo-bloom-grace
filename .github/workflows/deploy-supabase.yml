# Edge Functions + DB-Migrationen nach Supabase
# Secrets: SUPABASE_ACCESS_TOKEN (Pflicht), SUPABASE_DB_PASSWORD (für db push)

name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: true

jobs:
  deploy:
    name: Supabase Functions & Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN fehlt — nur Functions-Deploy übersprungen"
            exit 0
          fi
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref pstfazamjmpcywgtkoyt --password "$SUPABASE_DB_PASSWORD"
            supabase db push
          else
            echo "::warning::SUPABASE_DB_PASSWORD fehlt — db push übersprungen"
            supabase link --project-ref pstfazamjmpcywgtkoyt
          fi

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            exit 0
          fi
          for fn in branding-admin send-protocol-email kitchen-chat; do
            supabase functions deploy "$fn" --project-ref pstfazamjmpcywgtkoyt
          done

      - name: Verify public-get action
        if: env.SUPABASE_ACCESS_TOKEN != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          RESP="$(curl -fsSL -X POST "https://pstfazamjmpcywgtkoyt.supabase.co/functions/v1/branding-admin" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzdGZhemFtam1wY3l3Z3Rrb3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg2NDE2NzUsImV4cCI6MjA4NDIxNzY3NX0.Y--lvlqqF8Vs0eUwwnbPoVmZJ9kWmnZk2j-qIANaTaI" \
            -H "Content-Type: application/json" \
            -d '{"action":"public-get"}')"
          echo "$RESP"
          echo "$RESP" | grep -q '"branding"'
